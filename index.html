<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Daniel's Hub</title>
  <meta name="description" content="A personal library of AI tools, agent skills, guides and PDFs.">
  <meta name="theme-color" content="#12163F">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/app-icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <a class="skip" href="#fresh">Skip to resources</a>

  <header class="top" id="top">
    <a class="brand" href="index.html" aria-label="Daniel's Hub, home">
      <img src="assets/logo.svg" alt="" width="44" height="44">
      <span>Daniel's Hub</span>
    </a>
    <div class="top-end">
      <nav class="top-nav" aria-label="Main">
        <a href="#top">Home</a>
        <a href="#browse">Browse</a>
        <a href="#fresh">Fresh drops</a>
      </nav>
      <div class="menu-wrap" data-menu></div>
    </div>
  </header>

  <main>
    <section class="hero collapse" aria-labelledby="hero-title">
      <div class="collapse-inner hero-inner">
        <h1 id="hero-title">Everything worth keeping, in one place.</h1>
        <p class="lede">AI tools, guides and PDFs I found online.</p>
      </div>
    </section>

    <div id="search-anchor"></div>
    <div class="search-wrap" id="search-wrap">
      <form class="search" role="search" id="search-form" autocomplete="off">
        <svg class="ico" aria-hidden="true"><use href="#i-search"/></svg>
        <label class="sr" for="q">Search resources</label>
        <input id="q" name="q" type="search" placeholder="Search the hub" enterkeyhint="search" autocapitalize="off" autocorrect="off" spellcheck="false">
        <button type="button" class="clear" id="clear-search" aria-label="Clear search" hidden>
          <svg aria-hidden="true"><use href="#i-x"/></svg>
        </button>
      </form>
      <button type="button" class="cancel" id="cancel-search">Cancel</button>
    </div>

    <div class="admin-panel" id="admin-panel" hidden>
      <a class="admin-link" id="admin-link" href="admin/index.html">
        <svg aria-hidden="true"><use href="#i-lock"/></svg>
        <span>Admin Login</span>
        <svg class="go" aria-hidden="true"><use href="#i-arrow-right"/></svg>
      </a>
    </div>

    <section class="browse collapse" id="browse" aria-labelledby="browse-title">
      <div class="collapse-inner">
        <h2 id="browse-title" class="sr">Categories</h2>
        <div class="cats" id="cats"></div>
      </div>
    </section>

    <section class="fresh" id="fresh" aria-labelledby="fresh-title" tabindex="-1">
      <div class="fresh-head">
        <h2 id="fresh-title">Fresh drops</h2>
        <button type="button" class="reset" id="reset" hidden>Clear search</button>
      </div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
      <div class="list" id="list"></div>
      <div class="empty" id="empty" hidden>
        <p class="empty-title">Nothing found</p>
        <p id="empty-text"></p>
        <button type="button" class="reset" id="empty-reset">Back to home</button>
      </div>
    </section>
  </main>

  <footer class="foot">
    <p>Daniel's Hub</p>
    <p class="foot-note">Sample resources are shown until the dashboard is connected.</p>
  </footer>

  <nav class="dock" aria-label="Quick navigation">
    <a href="#top" id="dock-home" aria-current="page"><svg aria-hidden="true"><use href="#i-home"/></svg><span>Home</span></a>
    <a href="#browse" id="dock-browse"><svg aria-hidden="true"><use href="#i-grid"/></svg><span>Browse</span></a>
    <a href="#top" id="dock-search"><svg aria-hidden="true"><use href="#i-search"/></svg><span>Search</span></a>
  </nav>

  <script src="js/data.js"></script>
  <script src="js/config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
